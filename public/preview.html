<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fitlog</title>
  <style>
    :root {
      --bg: #0b0b0e;
      --card: #121217;
      --line: #24242c;
      --text: #f8f8f8;
      --muted: #9d9da8;
      --accent: #c9ff2f;
      --accent-2: #5dfcff;
      --danger: #ff5a5a;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 14px 42px rgba(0, 0, 0, 0.42);
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(1200px 400px at 80% -100px, #22253c 0%, transparent 60%),
        radial-gradient(800px 300px at 20% -80px, #17191f 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100dvh;
      position: relative;
      border-left: 1px solid rgba(255, 255, 255, 0.04);
      border-right: 1px solid rgba(255, 255, 255, 0.04);
      background: linear-gradient(180deg, #0a0a0d 0%, #0d0d12 100%);
    }

    .screen { display: none; padding: 22px 18px 92px; }
    .screen.active { display: block; animation: fadeIn .24s ease; }
    @keyframes fadeIn { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .hero {
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 20px;
      background:
        radial-gradient(200px 120px at 90% 0%, rgba(201, 255, 47, .2), transparent 60%),
        radial-gradient(220px 140px at 0% 100%, rgba(93, 252, 255, .15), transparent 60%),
        #111116;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .topline { display: flex; align-items: start; justify-content: space-between; margin-bottom: 14px; }
    .tag { font-size: 11px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
    .time { font-size: 28px; font-weight: 800; line-height: 1.1; margin-top: 4px; }
    .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .logo {
      width: 46px; height: 46px; border-radius: 14px;
      background: #0c0c10; border: 1px solid #2c2d37; display: grid; place-items: center;
      color: var(--accent); font-size: 20px; font-weight: 900;
    }

    .title { font-size: 34px; font-weight: 900; letter-spacing: .02em; margin-bottom: 6px; }
    .sub { color: #c7c7d3; font-size: 13px; }
    .hero-media {
      margin-top: 14px;
      border: 1px solid #2a2a31;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #0d0d11;
    }
    .hero-media img {
      width: 100%;
      height: 168px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .kpis { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .kpi {
      border-radius: 12px; border: 1px solid #2a2a31; background: #0f0f14; padding: 10px;
      text-align: center;
    }
    .kpi .v { font-size: 21px; font-weight: 900; color: var(--accent); }
    .kpi .l { font-size: 11px; color: var(--muted); margin-top: 3px; }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      padding: 14px;
      margin-bottom: 12px;
    }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row + .row { margin-top: 10px; }
    .h2 { font-size: 14px; color: #d8d8e2; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
    .hint { font-size: 12px; color: var(--muted); }

    .primary {
      border: none; width: 100%;
      border-radius: 15px; padding: 14px 12px;
      background: linear-gradient(135deg, var(--accent), #ecff9f);
      color: #0b0b0e; font-size: 15px; font-weight: 900; cursor: pointer;
      transition: transform .12s ease;
      margin: 10px 0 2px;
    }
    .primary:active { transform: scale(.98); }

    .tabs {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      border-top: 1px solid #26262f;
      background: rgba(10, 10, 14, .92);
      backdrop-filter: blur(8px);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      z-index: 20;
    }
    .tab {
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      color: #8f8f9d;
      font-size: 11px;
      padding: 8px 4px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab.active { color: #101010; background: var(--accent); }

    input, select {
      width: 100%;
      border: 1px solid #32323b;
      background: #0c0c10;
      color: #f0f0f0;
      border-radius: 12px;
      padding: 11px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent-2); }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .set-list { margin-top: 10px; display: grid; gap: 8px; }
    .set-item {
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid #2f2f37; border-radius: 12px; padding: 9px 10px; background: #101016;
    }
    .set-item b { font-size: 14px; }
    .set-item span { font-size: 12px; color: #a5a5b2; }
    .danger {
      border: 1px solid #4c2424; background: #291415; color: #ff9d9d;
      border-radius: 9px; font-size: 12px; padding: 6px 9px; cursor: pointer;
    }

    .item {
      border: 1px solid #2c2c34;
      border-radius: 14px;
      background: #101016;
      padding: 11px;
      margin-bottom: 8px;
    }
    .item h4 { font-size: 15px; font-weight: 800; }
    .item p { margin-top: 4px; font-size: 12px; color: #a5a5b2; }

    .chart {
      border: 1px solid #2b2b34;
      border-radius: 14px;
      background: #0f1014;
      padding: 12px;
      margin-top: 8px;
    }
    .bars {
      height: 120px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: end;
      gap: 5px;
      margin-top: 8px;
    }
    .bar {
      border-radius: 8px 8px 5px 5px;
      background: linear-gradient(180deg, #e8ff92 0%, #c9ff2f 100%);
      min-height: 6px;
      transition: height .25s ease;
    }
    .bar-labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 6px; }
    .bar-labels span { text-align: center; font-size: 10px; color: #858593; }
    .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .mini-kpi {
      border-radius: 12px;
      border: 1px solid #2d2d36;
      background: #111118;
      padding: 9px 8px;
      text-align: center;
    }
    .mini-kpi .v { font-size: 16px; font-weight: 900; color: #c9ff2f; }
    .mini-kpi .l { font-size: 10px; color: #8c8c99; margin-top: 3px; }
    .tool-row { display: flex; gap: 8px; margin-top: 10px; }
    .tool-row input {
      flex: 1;
      border-radius: 10px;
      border: 1px solid #2e2e38;
      background: #0f1014;
      color: #e8e8ef;
      font-size: 12px;
      padding: 9px 10px;
    }
    .pill-group { display: flex; gap: 6px; margin-top: 8px; }
    .pill {
      border: 1px solid #34343d;
      background: #101016;
      color: #9ea0af;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s ease;
    }
    .pill.active { background: #c9ff2f; border-color: #c9ff2f; color: #121212; }
    .tips { display: grid; gap: 7px; margin-top: 8px; }
    .tip-item {
      border: 1px solid #2c2c35;
      border-radius: 10px;
      background: #101116;
      color: #c8c8d3;
      font-size: 12px;
      line-height: 1.5;
      padding: 9px 10px;
    }
    .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .balance-box {
      border: 1px solid #2d2d36;
      border-radius: 10px;
      background: #101118;
      padding: 9px 10px;
    }
    .balance-box .k { font-size: 10px; color: #8c8d9a; }
    .balance-box .v { font-size: 14px; color: #e6e6ee; font-weight: 900; margin-top: 3px; }
    .user-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
    .user-btn {
      border: 1px solid #34343d;
      background: #101016;
      color: #a6a8b7;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .user-btn.active { background: #c9ff2f; border-color: #c9ff2f; color: #101010; }
    .danger-mini {
      border: 1px solid #4c2424;
      background: #291415;
      color: #ffabab;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .record-toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      border-radius: 12px;
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,.28);
      animation: popIn .18s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-8px) scale(.95); }
      to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    }
    .pr-overlay {
      position: fixed;
      inset: 0;
      z-index: 1200;
      background: radial-gradient(circle at 50% 30%, rgba(59,130,246,.35), rgba(15,23,42,.82));
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: prFade 1.6s ease forwards;
    }
    .pr-card {
      border: 2px solid rgba(255,255,255,.75);
      border-radius: 20px;
      padding: 24px 30px;
      text-align: center;
      color: #fff;
      background: linear-gradient(140deg, #2563eb 0%, #7c3aed 100%);
      box-shadow: 0 24px 80px rgba(76,29,149,.5);
      animation: prPop 1.1s ease;
    }
    .pr-big {
      font-size: 42px;
      font-weight: 1000;
      letter-spacing: 1px;
      animation: prScale 1s ease;
    }
    .pr-confetti {
      position: absolute;
      top: -10px;
      font-size: 18px;
      animation: prDrop 1.2s linear forwards;
    }
    @keyframes prFade {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes prPop {
      0% { transform: scale(.45) translateY(20px); opacity: 0; }
      30% { transform: scale(1.12) translateY(0); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes prScale {
      0% { transform: scale(.75); }
      40% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }
    @keyframes prDrop {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
    }

    .quote {
      margin-top: 10px;
      border: 1px solid #2d2d35;
      border-radius: 14px;
      padding: 12px;
      background: linear-gradient(140deg, #14161e 0%, #101015 70%);
      min-height: 64px;
      display: flex;
      align-items: center;
      color: #d4d4df;
      font-size: 13px;
      line-height: 1.45;
    }
    .mile-modal {
      position: fixed;
      inset: 0;
      z-index: 1300;
      background: rgba(15, 23, 42, .55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .mile-modal-card {
      width: min(420px, 100%);
      border-radius: 18px;
      border: 1px solid #312e81;
      background: linear-gradient(160deg, #141736, #0f1228);
      color: #e5e7ff;
      padding: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,.45);
      animation: popIn .2s ease;
    }
    .mile-close {
      margin-top: 10px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-weight: 800;
      padding: 9px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="screen active" data-screen="home">
      <div class="hero">
        <div class="topline">
          <div>
            <div class="tag">FITLOG PREVIEW</div>
            <div class="time" id="clock">00:00</div>
            <div class="date" id="date">2026-04-21</div>
          </div>
          <div class="logo">F</div>
        </div>
        <div class="title">JUST DO IT</div>
        <div class="sub">简洁、力量感和速度感并存的健身记录体验</div>
        <div class="hero-media">
          <img id="heroImage" alt="运动海报" src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=80">
        </div>
        <input id="imageFileInput" type="file" accept="image/*" style="display:none">
        <div class="kpis">
          <div class="kpi"><div class="v" id="kpiSessions">0</div><div class="l">训练次数</div></div>
          <div class="kpi"><div class="v" id="kpiSets">0</div><div class="l">总组数</div></div>
          <div class="kpi"><div class="v" id="kpiVolume">0</div><div class="l">力量容量</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="row"><div class="h2">今日训练入口</div><div class="hint">点击即可开始</div></div>
        <button class="primary" onclick="go('workout')">开始记录今天训练</button>
      </div>
      <div class="panel">
        <div class="row"><div class="h2">用户空间</div><div class="hint" id="currentUserText">当前：默认用户</div></div>
        <div class="row" style="justify-content:flex-start; gap:8px;">
          <button class="pill" id="addUserBtn">新建用户</button>
          <button class="danger-mini" id="deleteUserBtn">删除当前用户</button>
        </div>
        <div class="user-grid" id="userGrid"></div>
      </div>
      <div class="quote" id="quoteBox"></div>
    </section>

    <section class="screen" data-screen="workout">
      <div class="panel">
        <div class="row"><div class="h2">创建训练</div><div class="hint">动态表单</div></div>
        <div class="grid2 row">
          <select id="muscle">
            <option value="胸">胸</option>
            <option value="背">背</option>
            <option value="肩">肩</option>
            <option value="腿">腿</option>
            <option value="手臂">手臂</option>
            <option value="有氧">有氧</option>
          </select>
          <input id="exercise" placeholder="动作名（如平板卧推）">
        </div>
        <div class="grid2 row">
          <input id="weight" type="number" min="0" placeholder="重量 kg">
          <input id="reps" type="number" min="0" placeholder="次数 reps">
        </div>
        <div class="hint" id="inputModeHint">力量模式：按 重量 × 次数 记录</div>
        <button class="primary" id="addSetBtn">+ 添加一组</button>
      </div>

      <div class="panel">
        <div class="row"><div class="h2">当前会话</div><div class="hint" id="sessionMeta">0 组</div></div>
        <div class="set-list" id="setList"></div>
        <button class="primary" id="saveSessionBtn">保存这次训练</button>
      </div>
    </section>

    <section class="screen" data-screen="history">
      <div class="panel">
        <div class="row"><div class="h2">训练历史</div><div class="hint" id="historyCount">0 条</div></div>
        <div class="tool-row">
          <input id="historySearch" placeholder="搜索动作 / 部位">
        </div>
        <div class="pill-group">
          <button class="pill active" data-range="0">全部</button>
          <button class="pill" data-range="7">近7天</button>
          <button class="pill" data-range="30">近30天</button>
        </div>
        <div class="mini-grid" id="historyMetrics"></div>
        <div class="chart">
          <div class="hint">近14天综合负荷</div>
          <div class="bars" id="historyLoadBars"></div>
          <div class="bar-labels" id="historyLoadLabels"></div>
        </div>
      </div>
      <div id="historyList"></div>
    </section>

    <section class="screen" data-screen="summary">
      <div class="panel">
        <div class="row"><div class="h2">7天训练趋势</div><div class="hint">实时计算</div></div>
        <div class="chart">
          <div class="bars" id="bars"></div>
          <div class="bar-labels" id="barLabels"></div>
        </div>
      </div>
      <div class="panel">
        <div class="row"><div class="h2">最常练肌群</div><div class="hint" id="topMuscle">-</div></div>
        <p class="hint" id="summaryText">还没有训练记录，去「训练」页试试。</p>
      </div>
      <div class="panel">
        <div class="row"><div class="h2">训练画像</div><div class="hint" id="profileLevel">--</div></div>
        <p class="hint" id="profileDesc">持续记录后可获得训练画像与强度评价。</p>
      </div>
      <div class="panel">
        <div class="row"><div class="h2">长期成长轨迹</div><div class="hint">近6个月趋势</div></div>
        <div class="chart">
          <div class="bars" id="growthBars"></div>
          <div class="bar-labels" id="growthLabels"></div>
        </div>
        <div class="mini-grid" id="growthMetrics"></div>
      </div>
      <div class="panel">
        <div class="row"><div class="h2">成长对比卡</div><div class="hint">起点月 vs 当前月</div></div>
        <div class="grid2 row">
          <div>
            <div class="hint" style="margin-bottom:4px;">起点月</div>
            <select id="compareStart"></select>
          </div>
          <div>
            <div class="hint" style="margin-bottom:4px;">对比月</div>
            <select id="compareEnd"></select>
          </div>
        </div>
        <div class="tips" id="compareMetrics"></div>
      </div>
      <div class="panel">
        <div class="row"><div class="h2">成长里程碑</div><div class="hint">长期记录节点</div></div>
        <div class="tips" id="milestoneTimeline"></div>
        <div class="tips" id="milestoneDetail"></div>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="home">首页</button>
      <button class="tab" data-tab="workout">训练</button>
      <button class="tab" data-tab="history">历史</button>
      <button class="tab" data-tab="summary">总结</button>
    </nav>
  </div>

  <script>
    const KEY = "fitlog-preview-records-v2";
    const USER_STORE_KEY = "fitlog-preview-user-store-v1";
    const IMAGE_KEY = "fitlog-preview-hero-image-v1";
    const QUOTE_INDEX_KEY = "fitlog-preview-quote-index-v1";
    const DEFAULT_HERO_IMAGE = "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=80";
    const QUOTES = [
      "Just Do It.",
      "Impossible is Nothing. —— Adidas",
      "I can accept failure, everyone fails at something. But I can’t accept not trying. —— Michael Jordan",
      "Hard work beats talent when talent doesn’t work hard. —— Kevin Durant",
      "It’s not about perfect. It’s about effort.",
      "Success isn’t owned, it’s leased. And rent is due every day. —— J.J. Watt",
    ];

    let records = [];
    let userStore = { "默认用户": [] };
    let currentUser = "默认用户";
    let currentSets = [];
    let compareStartKey = "";
    let compareEndKey = "";
    const prevQuoteIndex = Number(localStorage.getItem(QUOTE_INDEX_KEY));
    let quoteIndex = Math.floor(Math.random() * QUOTES.length);
    if (Number.isFinite(prevQuoteIndex) && prevQuoteIndex >= 0 && prevQuoteIndex < QUOTES.length && QUOTES.length > 1) {
      while (quoteIndex === prevQuoteIndex) quoteIndex = Math.floor(Math.random() * QUOTES.length);
    }
    let historySearch = "";
    let historyRange = 0;

    function go(name) {
      document.querySelectorAll(".screen").forEach((el) => {
        el.classList.toggle("active", el.dataset.screen === name);
      });
      document.querySelectorAll(".tab").forEach((el) => {
        el.classList.toggle("active", el.dataset.tab === name);
      });
    }

    function loadData() {
      try {
        const savedUsers = JSON.parse(localStorage.getItem(USER_STORE_KEY) || "null");
        if (savedUsers && savedUsers.users) {
          userStore = savedUsers.users;
          currentUser = savedUsers.currentUser && userStore[savedUsers.currentUser]
            ? savedUsers.currentUser
            : Object.keys(userStore)[0];
        } else {
          records = JSON.parse(localStorage.getItem(KEY) || "[]");
          userStore = { "默认用户": records };
          currentUser = "默认用户";
        }
      } catch (e) {
        userStore = { "默认用户": [] };
        currentUser = "默认用户";
      }
      records = userStore[currentUser] || [];

      const savedImage = localStorage.getItem(IMAGE_KEY);
      document.getElementById("heroImage").src = savedImage || DEFAULT_HERO_IMAGE;
    }

    function saveData() {
      userStore[currentUser] = records;
      localStorage.setItem(
        USER_STORE_KEY,
        JSON.stringify({ users: userStore, currentUser })
      );
      localStorage.setItem(KEY, JSON.stringify(records));
    }
    function flashRecord(text, tone) {
      const old = document.getElementById("recordToast");
      if (old) old.remove();
      const toast = document.createElement("div");
      toast.id = "recordToast";
      toast.className = "record-toast";
      toast.style.background = tone || "#2563eb";
      toast.textContent = text;
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = "0"; toast.style.transition = "opacity .18s"; }, 980);
      setTimeout(() => toast.remove(), 1200);
    }
    function flashPR(exercise, value, isCardio) {
      const old = document.getElementById("prOverlay");
      if (old) old.remove();
      const overlay = document.createElement("div");
      overlay.id = "prOverlay";
      overlay.className = "pr-overlay";
      overlay.innerHTML = `
        <div class="pr-card">
          <div style="font-size:28px; margin-bottom:8px;">🏆</div>
          <div class="pr-big">NEW PR</div>
          <div style="margin-top:8px; font-weight:800;">${exercise} · ${value}${isCardio ? "min" : "kg"}</div>
        </div>
      `;
      document.body.appendChild(overlay);
      const confettiIcons = ["🎉", "✨", "🎊", "💥", "🟣", "🔵"];
      for (let i = 0; i < 28; i++) {
        const dot = document.createElement("div");
        dot.className = "pr-confetti";
        dot.textContent = confettiIcons[i % confettiIcons.length];
        dot.style.left = Math.random() * 100 + "vw";
        dot.style.animationDelay = Math.random() * 0.25 + "s";
        overlay.appendChild(dot);
      }
      setTimeout(() => overlay.remove(), 1700);
    }

    function renderUsers() {
      const grid = document.getElementById("userGrid");
      const keys = Object.keys(userStore);
      document.getElementById("currentUserText").textContent = "当前：" + currentUser;
      grid.innerHTML = keys.map((u) =>
        `<button class="user-btn ${u === currentUser ? "active" : ""}" data-user="${u}">${u}</button>`
      ).join("");
      document.querySelectorAll("[data-user]").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentUser = btn.getAttribute("data-user");
          records = userStore[currentUser] || [];
          renderUsers();
          renderAll();
        });
      });
    }

    function formatDate(d) {
      return new Date(d).toLocaleString("zh-CN", {
        month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
      });
    }

    function getFilteredHistoryRecords() {
      const keyword = historySearch.trim().toLowerCase();
      const rangeStart = historyRange > 0 ? new Date(Date.now() - historyRange * 86400000) : null;
      return records.filter((r) => {
        if (rangeStart && new Date(r.date) < rangeStart) return false;
        if (!keyword) return true;
        return r.exercise.toLowerCase().includes(keyword) || r.muscle.toLowerCase().includes(keyword);
      });
    }

    function renderCurrentSets() {
      const list = document.getElementById("setList");
      list.innerHTML = "";
      if (!currentSets.length) {
        list.innerHTML = '<div class="hint">还没有组，先添加一组。</div>';
      }
      currentSets.forEach((s, i) => {
        const item = document.createElement("div");
        item.className = "set-item";
        const isCardio = s.muscle === "有氧";
        const valueText = isCardio
          ? (s.duration + "分钟")
          : (s.weight + "kg × " + s.reps);
        item.innerHTML =
          "<div><b>" + (i + 1) + "组 · " + valueText + "</b>" +
          "<span> " + s.muscle + " / " + s.exercise + "</span></div>" +
          '<button class="danger" data-remove="' + i + '">删除</button>';
        list.appendChild(item);
      });

      document.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-remove"));
          currentSets.splice(idx, 1);
          renderCurrentSets();
        });
      });

      document.getElementById("sessionMeta").textContent = currentSets.length + " 组";
    }

    function renderHistory() {
      const filtered = getFilteredHistoryRecords();
      const box = document.getElementById("historyList");
      box.innerHTML = "";
      document.getElementById("historyCount").textContent = filtered.length + " 条";

      const strengthVolume = filtered
        .filter((r) => r.muscle !== "有氧")
        .reduce((sum, r) => sum + r.sets.reduce((s, x) => s + (Number(x.weight) || 0) * (Number(x.reps) || 0), 0), 0);
      const cardioMinutes = filtered
        .filter((r) => r.muscle === "有氧")
        .reduce((sum, r) => sum + r.sets.reduce((s, x) => s + (Number(x.duration) || 0), 0), 0);
      const best1RM = filtered
        .filter((r) => r.muscle !== "有氧")
        .flatMap((r) => r.sets.map((x) => {
          const w = Number(x.weight) || 0;
          const reps = Number(x.reps) || 0;
          return reps > 0 ? w * (1 + reps / 30) : 0;
        }));
      const best1RMVal = best1RM.length ? Math.round(Math.max(...best1RM)) : 0;
      document.getElementById("historyMetrics").innerHTML = [
        { v: Math.round(strengthVolume), l: "力量容量(kg)" },
        { v: Math.round(cardioMinutes), l: "有氧时长(min)" },
        { v: best1RMVal, l: "最佳估算1RM" }
      ].map((m) => `<div class="mini-kpi"><div class="v">${m.v}</div><div class="l">${m.l}</div></div>`).join("");

      const load14 = Array.from({ length: 14 }, (_, i) => {
        const d = new Date(Date.now() - (13 - i) * 86400000);
        const key = d.toLocaleDateString("zh-CN");
        const day = filtered.filter((r) => new Date(r.date).toLocaleDateString("zh-CN") === key);
        const dayStrength = day
          .filter((r) => r.muscle !== "有氧")
          .reduce((sum, r) => sum + r.sets.reduce((s, x) => s + (Number(x.weight) || 0) * (Number(x.reps) || 0), 0), 0);
        const dayCardio = day
          .filter((r) => r.muscle === "有氧")
          .reduce((sum, r) => sum + r.sets.reduce((s, x) => s + (Number(x.duration) || 0), 0), 0);
        return { label: d.toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" }), value: dayStrength / 120 + dayCardio * 0.8 };
      });
      const maxLoad = Math.max(1, ...load14.map((x) => x.value));
      const loadBars = document.getElementById("historyLoadBars");
      const loadLabels = document.getElementById("historyLoadLabels");
      loadBars.innerHTML = "";
      loadLabels.innerHTML = "";
      load14.forEach((x, i) => {
        const h = Math.max(6, Math.round((x.value / maxLoad) * 110));
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = h + "px";
        bar.title = x.value.toFixed(1);
        loadBars.appendChild(bar);
        if (i % 2 === 0) {
          const lb = document.createElement("span");
          lb.textContent = x.label.split("/").slice(-1)[0];
          loadLabels.appendChild(lb);
        } else {
          const blank = document.createElement("span");
          blank.textContent = "";
          loadLabels.appendChild(blank);
        }
      });

      if (!filtered.length) {
        box.innerHTML = '<div class="panel"><p class="hint">暂无历史，先去训练页保存一条。</p></div>';
        return;
      }

      [...filtered].reverse().forEach((r) => {
        const isCardio = r.muscle === "有氧";
        const volume = r.sets.reduce((sum, x) => {
          if (isCardio) return sum + (Number(x.duration) || 0);
          return sum + (Number(x.weight) || 0) * (Number(x.reps) || 0);
        }, 0);
        const dateKey = new Date(r.date).toLocaleDateString("zh-CN");
        const item = document.createElement("div");
        item.className = "item";
        const metricText = isCardio ? ("总时长 " + volume + " 分钟") : ("容量 " + volume);
        item.innerHTML =
          "<div style=\"display:flex;justify-content:space-between;gap:8px;align-items:flex-start;\">" +
          "<h4>" + r.exercise + " · " + r.muscle + "</h4>" +
          "<div style=\"display:flex;gap:6px;\">" +
          "<button class=\"danger-mini\" data-del-date=\"" + dateKey + "\">删当天</button>" +
          "<button class=\"danger-mini\" data-del-id=\"" + r.id + "\">删除</button>" +
          "</div></div>" +
          "<p>" + formatDate(r.date) + " · " + r.sets.length + "组 · " + metricText + "</p>";
        box.appendChild(item);
      });
      document.querySelectorAll("[data-del-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-del-id");
          if (!id) return;
          if (!confirm("删除这条训练记录？")) return;
          records = records.filter((r) => r.id !== id);
          saveData();
          renderAll();
        });
      });
      document.querySelectorAll("[data-del-date]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const date = btn.getAttribute("data-del-date");
          if (!date) return;
          if (!confirm("删除 " + date + " 的全部记录？")) return;
          records = records.filter((r) => new Date(r.date).toLocaleDateString("zh-CN") !== date);
          saveData();
          renderAll();
        });
      });
    }

    function renderSummary() {
      const totalSessions = records.length;
      const totalSets = records.reduce((sum, r) => sum + r.sets.length, 0);
      const totalVolume = records.reduce((sum, r) => {
        if (r.muscle === "有氧") return sum;
        return sum + r.sets.reduce((s, x) => s + (Number(x.weight) || 0) * (Number(x.reps) || 0), 0);
      }, 0);
      const totalCardioMinutes = records.reduce((sum, r) => {
        if (r.muscle !== "有氧") return sum;
        return sum + r.sets.reduce((s, x) => s + (Number(x.duration) || 0), 0);
      }, 0);
      document.getElementById("kpiSessions").textContent = String(totalSessions);
      document.getElementById("kpiSets").textContent = String(totalSets);
      document.getElementById("kpiVolume").textContent = String(totalVolume);

      const muscleCounter = {};
      records.forEach((r) => {
        muscleCounter[r.muscle] = (muscleCounter[r.muscle] || 0) + 1;
      });
      const sorted = Object.entries(muscleCounter).sort((a, b) => b[1] - a[1]);
      document.getElementById("topMuscle").textContent =
        sorted.length ? (sorted[0][0] + "（" + sorted[0][1] + "次）") : "-";
      document.getElementById("summaryText").textContent = sorted.length
        ? "你最常训练的是「" + sorted[0][0] + "」，累计有氧 " + totalCardioMinutes + " 分钟。"
        : "还没有训练记录，去「训练」页试试。";

      const now = new Date();
      const monthStart = new Date(Date.now() - 30 * 86400000);
      const monthRecords = records.filter((r) => new Date(r.date) >= monthStart);
      const trainedDays = new Set(monthRecords.map((r) => new Date(r.date).toLocaleDateString("zh-CN"))).size;
      const consistency = Math.min(100, Math.round((trainedDays / 30) * 100));
      const strengthRecords = monthRecords.filter((r) => r.muscle !== "有氧");
      const prLikeCount = monthRecords.filter((r) => {
        const isCardio = r.muscle === "有氧";
        const max = Math.max(...r.sets.map((x) => isCardio ? (Number(x.duration) || Number(x.weight) || 0) : (Number(x.weight) || 0)));
        const prev = records.filter((p) => p.exercise === r.exercise && new Date(p.date) < new Date(r.date));
        if (!prev.length) return false;
        const prevMax = Math.max(...prev.flatMap((p) => p.sets.map((x) => isCardio ? (Number(x.duration) || Number(x.weight) || 0) : (Number(x.weight) || 0))));
        return max > prevMax;
      }).length;
      const overloadRate = strengthRecords.length ? Math.round((prLikeCount / strengthRecords.length) * 100) : 0;
      const sessionDays = [...new Set(monthRecords.map((r) => new Date(r.date).toLocaleDateString("zh-CN")))]
        .map((d) => new Date(d.replace(/\//g, "-")).getTime())
        .sort((a, b) => a - b);
      const avgGap = sessionDays.length < 2
        ? 0
        : sessionDays.slice(1).reduce((sum, t, i) => sum + (t - sessionDays[i]) / 86400000, 0) / (sessionDays.length - 1);
      const rhythm = avgGap === 0 ? 0 : Math.max(0, Math.min(100, Math.round(100 - Math.abs(avgGap - 2) * 25)));
      const monthGrowth = Array.from({ length: 6 }, (_, i) => {
        const d = new Date(now.getFullYear(), now.getMonth() - (5 - i), 1);
        const start = new Date(d.getFullYear(), d.getMonth(), 1);
        const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
        const chunk = records.filter((r) => {
          const t = new Date(r.date).getTime();
          return t >= start.getTime() && t < end.getTime();
        });
        const sessions = chunk.length;
        const strength = chunk
          .filter((r) => r.muscle !== "有氧")
          .reduce((sum, r) => sum + r.sets.reduce((s, x) => s + (Number(x.weight) || 0) * (Number(x.reps) || 0), 0), 0);
        const cardio = chunk
          .filter((r) => r.muscle === "有氧")
          .reduce((sum, r) => sum + r.sets.reduce((s, x) => s + (Number(x.duration) || 0), 0), 0);
        return { label: (d.getMonth() + 1) + "月", score: strength / 1000 + cardio / 30, sessions };
      });
      const maxGrowth = Math.max(1, ...monthGrowth.map((x) => x.score));
      const growthBars = document.getElementById("growthBars");
      const growthLabels = document.getElementById("growthLabels");
      growthBars.innerHTML = "";
      growthLabels.innerHTML = "";
      monthGrowth.forEach((x) => {
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = Math.max(8, Math.round((x.score / maxGrowth) * 110)) + "px";
        bar.title = `训练${x.sessions}次`;
        growthBars.appendChild(bar);
        const lb = document.createElement("span");
        lb.textContent = x.label;
        growthLabels.appendChild(lb);
      });
      document.getElementById("growthMetrics").innerHTML = [
        { v: records.length, l: "累计训练" },
        { v: Math.round(totalCardioMinutes), l: "累计有氧(min)" },
        { v: Math.round(totalVolume), l: "累计力量(kg)" }
      ].map((m) => `<div class="mini-kpi"><div class="v">${m.v}</div><div class="l">${m.l}</div></div>`).join("");

      const sortedRecords = [...records].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
      const getMonthMetrics = (baseDate) => {
        const start = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
        const end = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1);
        const chunk = records.filter((r) => {
          const t = new Date(r.date).getTime();
          return t >= start.getTime() && t < end.getTime();
        });
        return {
          sessions: chunk.length,
          strength: chunk
            .filter((r) => r.muscle !== "有氧")
            .reduce((sum, r) => sum + r.sets.reduce((s, x) => s + (Number(x.weight) || 0) * (Number(x.reps) || 0), 0), 0),
          cardio: chunk
            .filter((r) => r.muscle === "有氧")
            .reduce((sum, r) => sum + r.sets.reduce((s, x) => s + (Number(x.duration) || 0), 0), 0),
        };
      };
      const nowDate = new Date();
      const toMonthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      const monthOptions = (() => {
        const start = sortedRecords[0]
          ? new Date(new Date(sortedRecords[0].date).getFullYear(), new Date(sortedRecords[0].date).getMonth(), 1)
          : new Date(nowDate.getFullYear(), nowDate.getMonth(), 1);
        const end = new Date(nowDate.getFullYear(), nowDate.getMonth(), 1);
        const list = [];
        const cursor = new Date(start);
        while (cursor.getTime() <= end.getTime()) {
          list.push({
            key: toMonthKey(cursor),
            label: `${cursor.getFullYear()}年${cursor.getMonth() + 1}月`,
            date: new Date(cursor),
          });
          cursor.setMonth(cursor.getMonth() + 1);
        }
        return list;
      })();
      const defaultStartKey = monthOptions[0]?.key || toMonthKey(nowDate);
      const defaultEndKey = monthOptions[monthOptions.length - 1]?.key || toMonthKey(nowDate);
      if (!monthOptions.some((m) => m.key === compareStartKey)) compareStartKey = defaultStartKey;
      if (!monthOptions.some((m) => m.key === compareEndKey)) compareEndKey = defaultEndKey;
      const startOption = monthOptions.find((m) => m.key === compareStartKey) || monthOptions[0];
      const endOption = monthOptions.find((m) => m.key === compareEndKey) || monthOptions[monthOptions.length - 1];
      const startMonth = startOption ? getMonthMetrics(startOption.date) : getMonthMetrics(nowDate);
      const endMonth = endOption ? getMonthMetrics(endOption.date) : getMonthMetrics(nowDate);
      const compareStartEl = document.getElementById("compareStart");
      const compareEndEl = document.getElementById("compareEnd");
      compareStartEl.innerHTML = monthOptions.map((m) => `<option value="${m.key}">${m.label}</option>`).join("");
      compareEndEl.innerHTML = monthOptions.map((m) => `<option value="${m.key}">${m.label}</option>`).join("");
      compareStartEl.value = compareStartKey;
      compareEndEl.value = compareEndKey;
      compareStartEl.onchange = (e) => {
        compareStartKey = e.target.value;
        renderSummary();
      };
      compareEndEl.onchange = (e) => {
        compareEndKey = e.target.value;
        renderSummary();
      };
      const growthPercent = (base, cur) => {
        if (base <= 0) return cur > 0 ? 100 : 0;
        return Math.round(((cur - base) / base) * 100);
      };
      document.getElementById("compareMetrics").innerHTML = [
        { l: "训练次数", a: startMonth.sessions, b: endMonth.sessions, unit: "次" },
        { l: "力量总量", a: Math.round(startMonth.strength), b: Math.round(endMonth.strength), unit: "kg" },
        { l: "有氧时长", a: Math.round(startMonth.cardio), b: Math.round(endMonth.cardio), unit: "min" }
      ].map((x) => {
        const p = growthPercent(x.a, x.b);
        const up = p >= 0;
        return `<div class="tip-item">
          <div style="display:flex;justify-content:space-between;gap:8px;">
            <strong>${x.l}</strong>
            <span style="color:${up ? "#34d399" : "#f87171"};font-weight:800;">${up ? "+" : ""}${p}%</span>
          </div>
          <div style="margin-top:4px;">${x.a}${x.unit} → ${x.b}${x.unit}</div>
        </div>`;
      }).join("");

      const dateKey = (d) => new Date(d).toLocaleDateString("zh-CN");
      const getDayDetails = (d) => {
        const key = dateKey(d);
        const dayRecords = sortedRecords.filter((r) => dateKey(r.date) === key);
        return dayRecords.slice(0, 6).map((r) => {
          const isCardio = r.muscle === "有氧";
          const best = isCardio
            ? Math.max(...r.sets.map((s) => Number(s.duration) || Number(s.weight) || 0), 0)
            : Math.max(...r.sets.map((s) => Number(s.weight) || 0), 0);
          return `${r.exercise} · ${r.muscle} · ${r.sets.length}组 · 峰值${best}${isCardio ? "min" : "kg"}`;
        });
      };
      const milestones = [];
      if (sortedRecords.length) {
        milestones.push({
          key: "start-" + dateKey(sortedRecords[0].date),
          title: "开启训练旅程",
          desc: "完成第一条训练记录",
          date: dateKey(sortedRecords[0].date),
          details: getDayDetails(sortedRecords[0].date),
        });
        const firstPr = sortedRecords.find((r, idx) => {
          if (idx === 0) return false;
          const isCardio = r.muscle === "有氧";
          const cur = Math.max(...r.sets.map((s) => isCardio ? (Number(s.duration) || Number(s.weight) || 0) : (Number(s.weight) || 0)), 0);
          const prev = sortedRecords
            .slice(0, idx)
            .filter((p) => p.exercise === r.exercise);
          if (!prev.length) return false;
          const prevMax = Math.max(...prev.flatMap((p) => p.sets.map((s) => isCardio ? (Number(s.duration) || Number(s.weight) || 0) : (Number(s.weight) || 0))), 0);
          return cur > prevMax;
        });
        if (firstPr) {
          milestones.push({
            key: "pr-" + dateKey(firstPr.date),
            title: "首次突破 PR",
            desc: firstPr.exercise + " 刷新纪录",
            date: dateKey(firstPr.date),
            details: getDayDetails(firstPr.date),
          });
        }
        let sAcc = 0;
        let cAcc = 0;
        let sDate = "";
        let cDate = "";
        sortedRecords.forEach((r) => {
          if (r.muscle === "有氧") {
            cAcc += r.sets.reduce((sum, s) => sum + (Number(s.duration) || 0), 0);
            if (!cDate && cAcc >= 300) cDate = r.date;
          } else {
            sAcc += r.sets.reduce((sum, s) => sum + (Number(s.weight) || 0) * (Number(s.reps) || 0), 0);
            if (!sDate && sAcc >= 10000) sDate = r.date;
          }
        });
        if (sDate) milestones.push({
          key: "strength-" + dateKey(sDate),
          title: "力量累计破万",
          desc: "累计力量总量达到 10000kg",
          date: dateKey(sDate),
          details: getDayDetails(sDate),
        });
        if (cDate) milestones.push({
          key: "cardio-" + dateKey(cDate),
          title: "心肺里程碑",
          desc: "累计有氧达到 300 分钟",
          date: dateKey(cDate),
          details: getDayDetails(cDate),
        });
      }
      const milestoneTimelineEl = document.getElementById("milestoneTimeline");
      const showMilestoneModal = (active) => {
        if (!active) return;
        const old = document.getElementById("mileModal");
        if (old) old.remove();
        const modal = document.createElement("div");
        modal.id = "mileModal";
        modal.className = "mile-modal";
        modal.innerHTML = `
          <div class="mile-modal-card" role="dialog" aria-modal="true">
            <div style="font-size:11px;color:#a5b4fc;">里程碑故事卡</div>
            <div style="font-size:18px;font-weight:900;margin-top:4px;">${active.title}</div>
            <div style="font-size:12px;color:#c7d2fe;margin-top:4px;">${active.desc}</div>
            <div style="font-size:12px;color:#818cf8;margin-top:6px;">${active.date}</div>
            <div style="margin-top:10px;border:1px solid #3730a3;background:#111533;border-radius:12px;padding:10px;line-height:1.5;">
              ${active.details.length ? active.details.map((x) => `<div style="font-size:12px;color:#dbeafe;">${x}</div>`).join("") : "<div style='font-size:12px;color:#dbeafe;'>当天暂无可展示动作明细。</div>"}
            </div>
            <button class="mile-close" id="mileCloseBtn">关闭</button>
          </div>
        `;
        document.body.appendChild(modal);
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.remove();
        });
        document.getElementById("mileCloseBtn").addEventListener("click", () => modal.remove());
      };
      milestoneTimelineEl.innerHTML = milestones.length
        ? milestones.map((m, idx) => `
            <button class="tip-item mile-item" data-mile-key="${m.key}" style="position:relative;padding-left:18px;width:100%;text-align:left;cursor:pointer;">
              <span style="position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:999px;background:#7c3aed;"></span>
              ${idx !== milestones.length - 1 ? '<span style="position:absolute;left:3px;top:14px;bottom:-10px;width:1px;background:#2b2b35;"></span>' : ""}
              <div style="font-weight:800;">${m.title}</div>
              <div style="color:#a8a9b8;font-size:12px;margin-top:3px;">${m.desc}</div>
              <div style="color:#8b5cf6;font-size:11px;margin-top:4px;">${m.date}</div>
            </button>
          `).join("")
        : `<div class="tip-item">继续记录，系统会自动生成你的成长里程碑。</div>`;
      document.querySelectorAll(".mile-item").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-mile-key");
          if (!key) return;
          const active = milestones.find((m) => m.key === key);
          showMilestoneModal(active);
        });
      });
      document.getElementById("milestoneDetail").innerHTML = `<div class="hint">点击里程碑可查看故事卡详情</div>`;

      const intensityMap = { easy: 1, medium: 2, hard: 3 };
      const avgIntensity = monthRecords.length
        ? (monthRecords.flatMap((r) => r.sets.map((s) => intensityMap[s.intensity || "medium"] || 2))
            .reduce((a, b) => a + b, 0) / Math.max(1, monthRecords.flatMap((r) => r.sets).length))
        : 0;
      const focusType =
        strengthRecords.length > records.filter((r) => r.muscle === "有氧").length * 1.6
          ? "力量主导型"
          : records.filter((r) => r.muscle === "有氧").length > strengthRecords.length * 1.6
          ? "心肺主导型"
          : monthRecords.length
          ? "均衡发展型"
          : "未形成训练习惯";
      const profileScore =
        consistency * 0.35 +
        overloadRate * 0.25 +
        rhythm * 0.2 +
        Math.min(100, totalCardioMinutes / 1.8) * 0.2;
      const profileLevel = profileScore >= 80 ? "进阶训练者" : profileScore >= 55 ? "稳定训练者" : "起步训练者";
      document.getElementById("profileLevel").textContent = profileLevel + " · " + focusType;
      document.getElementById("profileDesc").textContent =
        (focusType === "力量主导型" ? "力量占比更高，建议每周补2次中低强度有氧。"
          : focusType === "心肺主导型" ? "有氧占比更高，建议加入基础抗阻训练。"
          : focusType === "均衡发展型" ? "训练结构较均衡，可继续小步提升负荷。"
          : "记录还不够多，持续训练可获得更精准画像。")
        + " 平均强度 " + (avgIntensity ? avgIntensity.toFixed(2) : "--") + "/3。";

      const nowForWeek = new Date();
      const counts = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(nowForWeek);
        d.setDate(nowForWeek.getDate() - (6 - i));
        const dayKey = d.toLocaleDateString("zh-CN");
        const c = records.filter((r) => new Date(r.date).toLocaleDateString("zh-CN") === dayKey).length;
        return { label: "日一二三四五六"[d.getDay()], value: c };
      });

      const maxValue = Math.max(1, ...counts.map((c) => c.value));
      const bars = document.getElementById("bars");
      const labels = document.getElementById("barLabels");
      bars.innerHTML = "";
      labels.innerHTML = "";
      counts.forEach((c) => {
        const h = Math.max(8, Math.round((c.value / maxValue) * 110));
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = h + "px";
        bar.title = c.value + " 次";
        bars.appendChild(bar);

        const lb = document.createElement("span");
        lb.textContent = c.label;
        labels.appendChild(lb);
      });
    }

    function renderAll() {
      renderCurrentSets();
      renderHistory();
      renderSummary();
    }

    function tickClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString("zh-CN", {
        hour: "2-digit", minute: "2-digit"
      });
      document.getElementById("date").textContent = now.toLocaleDateString("zh-CN", {
        year: "numeric", month: "long", day: "numeric", weekday: "long"
      });
    }

    function refreshInputMode() {
      const muscle = document.getElementById("muscle").value;
      const weightInput = document.getElementById("weight");
      const repsInput = document.getElementById("reps");
      const hint = document.getElementById("inputModeHint");
      if (muscle === "有氧") {
        weightInput.placeholder = "时长 min";
        repsInput.placeholder = "强度 1-10";
        hint.textContent = "有氧模式：按 时长（分钟） 计算，强度可选";
      } else {
        weightInput.placeholder = "重量 kg";
        repsInput.placeholder = "次数 reps";
        hint.textContent = "力量模式：按 重量 × 次数 记录";
      }
    }

    document.querySelectorAll(".tab").forEach((btn) => {
      btn.addEventListener("click", () => go(btn.dataset.tab));
    });

    document.getElementById("historySearch").addEventListener("input", (e) => {
      historySearch = e.target.value || "";
      renderHistory();
    });
    document.querySelectorAll("[data-range]").forEach((btn) => {
      btn.addEventListener("click", () => {
        historyRange = Number(btn.getAttribute("data-range")) || 0;
        document.querySelectorAll("[data-range]").forEach((x) => x.classList.remove("active"));
        btn.classList.add("active");
        renderHistory();
      });
    });

    document.getElementById("muscle").addEventListener("change", refreshInputMode);

    document.getElementById("addSetBtn").addEventListener("click", () => {
      const muscle = document.getElementById("muscle").value.trim();
      const exercise = document.getElementById("exercise").value.trim();
      const weight = Number(document.getElementById("weight").value);
      const reps = Number(document.getElementById("reps").value);
      if (!exercise) return alert("请输入动作名");
      if (muscle === "有氧") {
        if (!Number.isFinite(weight) || weight <= 0) return alert("请输入有效的有氧时长（分钟）");
        const prevPR = records
          .filter((r) => r.exercise === exercise)
          .reduce((maxVal, r) => {
            const localMax = Math.max(...r.sets.map((s) => Number(s.duration) || Number(s.weight) || 0), 0);
            return Math.max(maxVal, localMax);
          }, 0);
        const intensity = Number.isFinite(reps) && reps > 0 ? reps : null;
        currentSets.push({ muscle, exercise, duration: weight, intensity });
        if (prevPR > 0 && weight > prevPR) flashPR(exercise, weight, true);
      } else {
        if (!Number.isFinite(weight) || !Number.isFinite(reps) || weight < 0 || reps <= 0) {
          return alert("请输入有效的重量和次数");
        }
        const prevPR = records
          .filter((r) => r.exercise === exercise)
          .reduce((maxVal, r) => {
            const localMax = Math.max(...r.sets.map((s) => Number(s.weight) || 0), 0);
            return Math.max(maxVal, localMax);
          }, 0);
        currentSets.push({ muscle, exercise, weight, reps });
        if (prevPR > 0 && weight > prevPR) flashPR(exercise, weight, false);
      }
      renderCurrentSets();
      document.getElementById("weight").value = "";
      document.getElementById("reps").value = "";
      flashRecord(
        muscle === "有氧"
          ? `+1 组 ${weight}分钟 已记录`
          : `+1 组 ${weight}kg × ${reps}次`,
        muscle === "有氧" ? "#0d9488" : "#2563eb"
      );
    });

    document.getElementById("saveSessionBtn").addEventListener("click", () => {
      if (!currentSets.length) return alert("至少先添加一组");
      const first = currentSets[0];
      records.push({
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        date: new Date().toISOString(),
        muscle: first.muscle,
        exercise: first.exercise,
        sets: currentSets.map((s) => {
          if (s.muscle === "有氧") return { duration: s.duration, intensity: s.intensity };
          return { weight: s.weight, reps: s.reps };
        })
      });
      saveData();
      currentSets = [];
      renderAll();
      go("history");
    });

    document.getElementById("heroImage").addEventListener("click", () => {
      document.getElementById("imageFileInput").click();
    });
    document.getElementById("addUserBtn").addEventListener("click", () => {
      const name = (prompt("请输入新用户名") || "").trim();
      if (!name) return;
      if (!userStore[name]) userStore[name] = [];
      currentUser = name;
      records = userStore[currentUser];
      saveData();
      renderUsers();
      renderAll();
    });
    document.getElementById("deleteUserBtn").addEventListener("click", () => {
      const names = Object.keys(userStore);
      if (names.length <= 1) return alert("至少保留一个用户");
      if (!confirm("删除当前用户及其全部记录？")) return;
      delete userStore[currentUser];
      currentUser = Object.keys(userStore)[0];
      records = userStore[currentUser] || [];
      saveData();
      renderUsers();
      renderAll();
    });

    document.getElementById("imageFileInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = String(reader.result || "");
        if (!dataUrl) return;
        document.getElementById("heroImage").src = dataUrl;
        localStorage.setItem(IMAGE_KEY, dataUrl);
      };
      reader.readAsDataURL(file);
    });

    const quoteBox = document.getElementById("quoteBox");
    function rotateQuote() {
      quoteBox.style.opacity = "0.1";
      setTimeout(() => {
        quoteBox.textContent = "⚡ " + QUOTES[quoteIndex];
        quoteBox.style.opacity = "1";
        localStorage.setItem(QUOTE_INDEX_KEY, String(quoteIndex));
        quoteIndex = (quoteIndex + 1) % QUOTES.length;
      }, 130);
    }

    loadData();
    renderUsers();
    tickClock();
    refreshInputMode();
    renderAll();
    rotateQuote();
    setInterval(tickClock, 1000);
    setInterval(rotateQuote, 6000);
  </script>
</body>
</html>
